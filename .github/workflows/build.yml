name: build

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main", "master"]

jobs:
  build:
    name: Build & Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            7.0.x
            8.0.x
            9.0.x

      - name: Restore
        run: |
          projects=$(find sources -name "*.csproj")
          if [ -z "$projects" ]; then
            echo "No projects found yet — skipping restore."
            exit 0
          fi
          for proj in $projects; do
            echo "::group::restore $proj"
            dotnet restore "$proj"
            echo "::endgroup::"
          done

      - name: Build
        run: |
          projects=$(find sources -name "*.csproj")
          if [ -z "$projects" ]; then
            echo "No projects found yet — skipping build."
            exit 0
          fi
          for proj in $projects; do
            echo "::group::build $proj"
            dotnet build "$proj" --no-restore --nologo
            echo "::endgroup::"
          done

      - name: Format check
        run: |
          projects=$(find sources -name "*.csproj")
          if [ -z "$projects" ]; then
            echo "No projects found yet — skipping format check."
            exit 0
          fi
          for proj in $projects; do
            echo "::group::format $proj"
            dotnet format "$proj" --verify-no-changes --no-restore --severity info
            echo "::endgroup::"
          done
